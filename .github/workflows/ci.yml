name: CI & Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build (Turbopack + TypeScript)
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://klu-vss.vercel.app
          NEXT_PUBLIC_ALLOWED_EMAIL_DOMAIN: kluniversity.in
